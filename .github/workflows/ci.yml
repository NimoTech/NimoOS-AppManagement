name: CI

# Build, vet and test on every pull request, and on main so a bad merge shows up
# immediately rather than surprising the next person to open a PR.
on:
  pull_request:
  push:
    branches: [main]

# Read-only: nothing here publishes anything. A token that cannot write is one
# that cannot be misused by a compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NimoOS-AppManagement
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: NimoOS-AppManagement

      # go.mod redirects github.com/NimoTech/NimoOS-Common to
      # ../NimoOS-Common and nothing is vendored, so a lone checkout of
      # this repository cannot build. CI has to reproduce the sibling
      # layout that a developer checkout has.
      #
      # NimoOS-MessageBus is here for api/message_bus/openapi.yaml, which this
      # repository's go:generate reads to build its message-bus client.
      - name: Check out NimoOS-Common
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NimoTech/NimoOS-Common
          path: NimoOS-Common
          # Only needed while these repositories are private. Once they are
          # public the default job token suffices and this secret can go.
          token: ${{ secrets.CI_SIBLING_TOKEN || github.token }}
      - name: Check out NimoOS-MessageBus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NimoTech/NimoOS-MessageBus
          path: NimoOS-MessageBus
          # Only needed while these repositories are private. Once they are
          # public the default job token suffices and this secret can go.
          token: ${{ secrets.CI_SIBLING_TOKEN || github.token }}

      # Take the toolchain from go.mod so this workflow cannot drift from what
      # the module actually declares.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: NimoOS-AppManagement/go.mod
          cache-dependency-path: NimoOS-AppManagement/go.sum

      # codegen/ is gitignored, so a fresh clone has no generated API code
      # and does not compile until this runs. Regenerating here also means a
      # spec change that breaks codegen is caught in CI rather than on
      # someone's machine a week later.
      - name: Generate API code
        working-directory: NimoOS-AppManagement
        run: go generate ./...

      # Pure Go, matching NimoOS-Build/scripts/deploy.sh.
      - name: Build
        working-directory: NimoOS-AppManagement
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Vet
        working-directory: NimoOS-AppManagement
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      # Everything skipped below is skipped for a stated reason, so that a
      # red run always means something is genuinely broken.
      #
      # All four reach for an app store that does not exist. The CasaOS
      # rename rewrote the hostnames in these tests without checking that
      # anything answers at the new ones: github.com/NimoTech/_appstore is
      # not a repository, and nimoos.app does not resolve at all.
      #
      # TestAppStoreList is the worst of them — it blocks on a channel that
      # only the (never-arriving) registration callback writes to, so it
      # hangs until go test's 10-minute timeout kills the entire package,
      # taking every other test in it down as collateral. That is what hid
      # the other three, and hid TestWorkDir asserting the old CasaOS hash.
      #
      # Point them at a fixture that exists and delete this skip.
      - name: Test
        working-directory: NimoOS-AppManagement
        env:
          CGO_ENABLED: "0"
        run: go test -skip '^(TestAppStoreList|TestGetComposeApp|TestGetApp|TestSkipUpdateCatalog)$' ./...
